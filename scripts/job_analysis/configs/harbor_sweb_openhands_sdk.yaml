# =============================================================================
# Profile: Harbor Job + OpenHands SDK — SWE-bench Verified
# =============================================================================
# 场景: Harbor 评测产物（每 instance 一个 trial 目录）+ Harbor dataset gold
# 运行: python run.py --config configs/harbor_sweb_openhands_sdk.yaml
# =============================================================================

data:
  log_dir: "<path-to-harbor-job>"                    # 例: ../../jobs/swebench-verified-...
  dataset_dir: "<path-to-dataset>/swebench-verified" # Harbor dataset 根目录

  trajectory_layout: harbor_job
  gold_source: harbor_dataset
  trajectory_subpath: "agent/litellm-trajectory.jsonl"
  trial_result_file: "result.json"
  trial_report_subpath: "verifier/report.json"
  max_iterations_default: 200

output:
  # dir 留空 → 自动推导为 output/<log_dir 目录名>
  instances_jsonl: "instances.jsonl"
  report_json: "report.json"

analysis:
  include_resolved: true
  include_errors: true
  include_empty_patch: true

features:
  loop_threshold: 3
  premature_stop_threshold: 0.3
  tool_error_storm_threshold: 5

judge:
  enabled: false
  model: "claude-sonnet-4-6"
  max_trajectory_chars: 8000

hack_detector:
  enabled: true

# task_analysis.enabled 默认 false

instance_analysis:
  enabled: true
  out_subdir: "instance_analysis"

traj_analysis:
  enabled: true
  out_subdir: "traj_analysis"
  max_instances: null        # 调试时可设为整数限制条数

skip_main_pipeline: false    # true = 跳过主 pipeline，仅跑上面三个可选阶段

scaffold: "openhands-sdk"
model: "<your-model-name>"
taxonomy_version: "v1"
judge_version: "v1"
