schema_version = "1.1"

[metadata]
author_name = "unknown"
author_email = "unknown"
difficulty = "{difficulty}"
category = "debugging"
tags = ["debugging", "swe-rebench-v2"]

[verifier]
# Overall time budget for the agent's work (seconds)
timeout_sec = {max_timeout}
network_mode = "public"

[verifier.env]
_JAVA_OPTIONS = "-Djava.net.preferIPv6Addresses=false"

[agent]
# Set to same as verifier unless you want to restrict agent time separately
timeout_sec = {max_timeout}

[environment]
build_timeout_sec = 1800.0
cpus = {cpus}
memory_mb = {memory_mb}
storage_mb = {storage_mb}
network_mode = "public"
